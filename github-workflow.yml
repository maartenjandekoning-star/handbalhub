name: Update HandbalHub data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm install

      - name: Chromium installeren
        run: npx playwright install --with-deps chromium

      - name: HandbalHub bijwerken
        run: npm run update

      - name: Nieuwe gegevens opslaan
        run: |
          git config user.name "HandbalHub Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app-data.json
          git diff --cached --quiet || git commit -m "Automatische HandbalHub update"
          git push
