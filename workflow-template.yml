name: Update HandbalHub data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "update-data.mjs"
      - "standings-config.json"
      - "package.json"
      - ".github/workflows/update-handbalhub.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run update
      - name: Gegevens opslaan
        run: |
          git config user.name "HandbalHub Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app-data.json
          git diff --cached --quiet || git commit -m "Automatische nieuws- en standenupdate"
          git push
