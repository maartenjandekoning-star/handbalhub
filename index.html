<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061d3a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>HandbalHub 13.1</title>
</head>
<body>
<div class="app">
  <header class="hero hero-news">
    <div class="top">
      <div class="brand">
        <img src="icon-192.png" alt="HandbalHub">
        <div><h1>HANDBAL<span>HUB</span></h1><p>NEDERLAND</p></div>
      </div>
      <button class="round" id="refreshButton" aria-label="Vernieuwen">↻</button>
    </div>
    <div class="welcome">
      <h2>Het laatste Nederlandse handbalnieuws</h2>
      <p id="updatedText">Nieuws wordt geladen…</p>
    </div>
    <div class="news-kpis">
      <div><strong id="nNews">0</strong><span>berichten</span></div>
      <div><strong id="nSources">0</strong><span>bronnen</span></div>
      <div><strong id="nLive">0</strong><span>live</span></div>
    </div>
  </header>

  <main>
    <section id="news" class="view active">
      <div class="news-toolbar">
        <input class="search" id="newsSearch" placeholder="Zoek club, speler of onderwerp">
        <div class="filters" id="newsFilters"></div>
      </div>
      <div id="newsStatus" class="data-state">Nieuws wordt voorbereid…</div>
      <div class="news-grid section" id="allNews"></div>
    </section>

    <section id="teams" class="view">
      <div class="section-head"><h2>Mijn teams</h2><span class="badge">Favorieten</span></div>
      <div class="card setup">
        <h3>Zoek en volg</h3>
        <input class="search" id="teamSearch" placeholder="Zoek club, team of competitie">
        <div id="catalog"></div>
      </div>
    </section>

    <section id="competitions" class="view">
      <div class="section-head"><h2>Competities</h2><span class="badge">Standen</span></div>
      <div class="card setup">
        <input class="search" id="competitionSearch" placeholder="Zoek competitie">
        <div id="competitionCatalog"></div>
      </div>
      <div class="section"><div class="grid grid-2" id="favoriteCompetitions"></div></div>
    </section>

    <section id="live" class="view">
      <div class="section-head"><h2>Live & video</h2><span class="badge live">Bevestigd</span></div>
      <div class="card" id="liveList"></div>
    </section>

    <section id="more" class="view">
      <div class="section-head"><h2>Meer</h2></div>
      <div class="hub-grid">
        <button class="hub-tile" data-go="teams"><b>★</b><span>Mijn teams</span></button>
        <button class="hub-tile" data-go="competitions"><b>🏆</b><span>Competities</span></button>
        <button class="hub-tile" data-go="live"><b>▶</b><span>Live & video</span></button>
        <a class="hub-tile" href="https://handbal.nl/programma-uitslagen-standen/" target="_blank"><b>▦</b><span>Handbal.nl</span></a>
        <a class="hub-tile" href="https://apps.apple.com/nl/app/handbalnl/id1272156836" target="_blank"><b>📱</b><span>HandbalNL</span></a>
      </div>
      <div class="card section"><h2>Opgeslagen</h2><div class="news-grid" id="saved"></div></div>
    </section>
  </main>
</div>

<nav class="nav">
  <button class="active" data-view="news"><b>▤</b>Nieuws</button>
  <button data-view="teams"><b>★</b>Mijn teams</button>
  <button data-view="competitions"><b>🏆</b>Competities</button>
  <button data-view="live"><b>▶</b>Live</button>
  <button data-view="more"><b>•••</b>Meer</button>
</nav>

<script src="app.js?v=13.1.0"></script>
</body>
</html>
