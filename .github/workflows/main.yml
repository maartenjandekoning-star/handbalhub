name: Update HandbalHub data

on:
  workflow_dispatch:
    inputs:
      task:
        description: Kies update
        required: true
        default: all
        type: choice
        options:
          - all
          - news
          - standings
          - discover

  schedule:
    - cron: "17 */6 * * *"

  push:
    paths:
      - "update-news.mjs"
      - "update-standings.mjs"
      - "discover-pools.mjs"
      - "update-shared.mjs"
      - "standings-config.json"
      - "package.json"
      - ".github/workflows/main.yml"

permissions:
  contents: write

concurrency:
  group: handbalhub-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Afhankelijkheden installeren
        run: npm install

      - name: Browser installeren
        run: npx playwright install --with-deps chromium

      - name: Poules ontdekken
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.task == 'discover' || inputs.task == 'all') }}
        timeout-minutes: 4
        continue-on-error: true
        run: npm run discover:pools

      - name: Nieuws ophalen
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.task == 'news' || inputs.task == 'all' }}
        timeout-minutes: 4
        continue-on-error: true
        run: npm run update:news

      - name: Standen ophalen
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.task == 'standings' || inputs.task == 'all' }}
        timeout-minutes: 3
        continue-on-error: true
        run: npm run update:standings

      - name: Nieuwe gegevens veilig opslaan
        run: |
          git config user.name "HandbalHub Bot"
          git config user.email "actions@users.noreply.github.com"

          git add app-data.json standings-config.json
          git diff --cached --quiet && exit 0

          git commit -m "Automatische HandbalHub update"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
