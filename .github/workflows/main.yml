name: Update HandbalHub data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "update-data.mjs"
      - "standings-config.json"
      - "package.json"
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm install

      - name: Browser installeren
        run: npx playwright install --with-deps chromium

      - name: Nieuws en standen ophalen
        run: npm run update

      - name: Nieuwe gegevens opslaan
        run: |
          git config user.name "HandbalHub Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app-data.json
          git diff --cached --quiet || git commit -m "Automatische nieuws- en standenupdate"
          git push
